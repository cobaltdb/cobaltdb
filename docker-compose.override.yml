# Docker Compose Override for Windows Development
# This file is automatically loaded by docker-compose on Windows

services:
  cobaltdb:
    # Windows-specific settings
    # Use named volumes instead of bind mounts for better Windows performance
    # ⚠ SECURITY: Only uncomment the line below in isolated/dev environments.
    # Enabling cleartext auth allows passwords to travel unencrypted on the wire.
    # environment:
    #   - COBALTDB_ALLOW_CLEARTEXT_AUTH=true
    volumes:
      - cobaltdb_data:/data/cobaltdb

  backup:
    # Run backup service with local timezone
    environment:
      - BACKUP_SCHEDULE=0 2 * * *
      - BACKUP_RETENTION_DAYS=7
      - TZ=UTC

  # Disable some services for lightweight development
  # Comment out to enable
  # prometheus:
  #   profiles: ["monitoring"]
  #
  # grafana:
  #   profiles: ["monitoring"]

volumes:
  cobaltdb_data:
    driver: local
